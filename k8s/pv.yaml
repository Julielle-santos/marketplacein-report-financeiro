apiVersion: v1
kind: PersistentVolume
metadata:
  name: financial-report-reports-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  hostPath:
    path: /data/financial-report/reports
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: financial-report-logs-pv
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  hostPath:
    path: /data/financial-report/logs 