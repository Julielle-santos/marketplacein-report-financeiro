apiVersion: apps/v1
kind: Deployment
metadata:
  name: financial-report
spec:
  replicas: 1
  selector:
    matchLabels:
      app: financial-report
  template:
    metadata:
      labels:
        app: financial-report
    spec:
      containers:
      - name: financial-report
        image: prdbrscadastroacr01.azurecr.io/marketplacein/financial-report:1.0.25
        env:
        - name: TZ
          value: "America/Sao_Paulo"
        envFrom:
        - configMapRef:
            name: financial-report-config
        - secretRef:
            name: financial-report-secrets
        volumeMounts:
        - name: reports
          mountPath: /app/reports
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: reports
        persistentVolumeClaim:
          claimName: financial-report-reports-pvc
      - name: logs
        persistentVolumeClaim:
          claimName: financial-report-logs-pvc