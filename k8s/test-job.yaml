apiVersion: batch/v1
kind: Job
metadata:
  name: financial-report-test
  namespace: marketplace
spec:
  template:
    spec:
      imagePullSecrets:
      - name: harbor-registry-secret
      containers:
      - name: financial-report
        image: hcr.profarma.com.br/d1000-digital/financial-report:1.0.22
        env:
        - name: TZ
          value: "America/Sao_Paulo"
        envFrom:
        - configMapRef:
            name: financial-report-config
        - secretRef:
            name: financial-report-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: reports-volume
          mountPath: /app/reports
        - name: logs-volume
          mountPath: /app/logs
      volumes:
      - name: reports-volume
        persistentVolumeClaim:
          claimName: financial-report-reports-pvc
      - name: logs-volume
        persistentVolumeClaim:
          claimName: financial-report-logs-pvc
      restartPolicy: OnFailure 